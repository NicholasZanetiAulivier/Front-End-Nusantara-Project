<!DOCTYPE html>
<html>

<head>
    <title>Suku-Suku di Indonesia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style/fonts.css">
    <link rel="stylesheet" href="style/indexStyle.css">
    <link rel="stylesheet" href="style/indexResponsive.css">

    <script type="text/javascript" src="scripts/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="scripts/indexScript.js" defer></script>
</head>

<body>
    <div id="topnavbar">
        <a id="navtitle"><img src="rsc/ss.png"></a>
        <ul>
            <li><a href="#featured">Beranda</a></li>
            <li><a href="#randomBanner">Menarik</a></li>
            <li><a href="#searchAndResults">Cari</a></li>
        </ul>
        <button class="activator"><img src="rsc/menu.png"></button>
    </div>

    <div id="carousel">
        <img src="rsc/carousel_1.jpg">
        <img src="rsc/carousel_2.jpg">
        <img src="rsc/carousel_3.jpeg">
        <img src="rsc/carousel_4.jpg">
        <img src="rsc/carousel_5.jpg">
        <div>
            <span>Keindahan Dunia</span>
            <span>Budaya Indonesia</span>
        </div>
        <a id="goToSearch" href="#searchAndResults">Start Searching</a>
    </div>

    <div id="featured">
        <span class="partTitle">Beranda</span>
        <div class="featuredItems">
            <a href="#">
                <div class="items">
                    <img class="itemImage" src="https://www.selasar.com/wp-content/uploads/2020/07/Featured-image.jpg">
                    <div class="itemText">
                        <span class="itemTitle"></span>
                        <span class="itemDescription"></span>
                    </div>
                </div>
            </a>
            <a href="#">
                <div class="items">
                    <img class="itemImage" src="https://www.selasar.com/wp-content/uploads/2020/07/Featured-image.jpg">
                    <div class="itemText">
                        <span class="itemTitle"></span>
                        <span class="itemDescription"></span>
                    </div>
                </div>
            </a>
            <a href="#">
                <div class="items">
                    <img class="itemImage" src="https://www.selasar.com/wp-content/uploads/2020/07/Featured-image.jpg">
                    <div class="itemText">
                        <span class="itemTitle"></span>
                        <span class="itemDescription"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div id="randomBanner">
        <img src="rsc/carousel_1.jpg" class="background">
        <div class="left">
            <span>Artikel Menarik</span>
        </div>
        <div class="partTitle"></div>
        <div class="description"></div>
        <a>
            <div>
                Lanjutkan&#8658;
            </div>
        </a>
    </div>

    <form id="searchAndResults">
        <div class="partTitle">&#128607;&#128602;Cari Suku&#128601;&#128604;</div>
        <div class="row">
            <div id="search">
                <div class="searchByName">
                    <input type="text" name="searchInput" id="searchInput" placeholder="Nama Suku">
                    <button id="enableFilters">
                        <img src="rsc/filter_outline.png" id="enableFiltersImg">
                    </button>
                </div>
                <div class="filters">
                    <div class="inputField">
                        <label for="weapons">Senjata Tradisional</label>
                        <input type="text" name="weapons" id="weapons">
                    </div>
                    <div class="inputField">
                        <label for="dance">Tarian Tradisional</label>
                        <input type="text" name="dance" id="dance">
                    </div>
                    <div class="inputField">
                        <label for="clothes">Pakaian Adat</label>
                        <input type="text" name="clothes" id="clothes">
                    </div>
                    <div class="inputField">
                        <label for="house">Rumah Adat</label>
                        <input type="text" name="house" id="house">
                    </div>
                    <div class="inputField">
                        <label for="food">Kuliner</label>
                        <input type="text" name="food" id="food">
                    </div>
                    <div class="inputField">
                        <label for="misc">Lainnya</label>
                        <input type="text" name="misc" id="misc">
                    </div>
                </div>
            </div>
            <div id="results">
                <div class="item">
                    <img src="rsc/carousel_5.jpg">
                    <div class="text">
                        <div class="title"></div>
                        <p></p>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <footer>
        <div class="partTitle">Suku Search</div>
        <div>
            <div>
                <span>Contact Us</span>
                <div class="socialMedia">
                    <img src="rsc/social_media/facebook.png">
                    <img src="rsc/social_media/instagram.png">
                    <img src="rsc/social_media/pinterest.png">
                    <img src="rsc/social_media/twitter.png">
                    <img src="rsc/social_media/whatsapp.png">
                </div>
            </div>
            <div>
                <ul>
                    <li><a>Home</a></li>
                    <li><a>About Us</a></li>
                    <li><a>Blog</a></li>
                    <li><a>News and Events</a></li>
                </ul>
            </div>
        </div>
        <div class="credit">
            Made by Suku Search Team
        </div>
    </footer>
</body>

</html>
